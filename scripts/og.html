<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#161618;background:linear-gradient(135deg,#f3f0ff 0%,#fafafd 50%,#eef5ff 100%);display:grid;grid-template-columns:1fr 430px;gap:56px;align-items:center;padding:0 84px;box-sizing:border-box}
.k{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:500;color:#5b45c8}.k img{width:44px;height:44px}
h1{margin:22px 0 0;font-size:64px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
p{margin:22px 0 0;font-size:24px;color:#5c5c63;line-height:1.4}
.card{background:#fff;border-radius:26px;padding:26px 28px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 60px rgba(20,20,60,.12)}
.row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid rgba(0,0,0,.08);font-size:19px}.row:first-child{border-top:0}
.c{font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;min-width:74px;text-align:center}
.p{color:#17724a;background:rgba(48,177,88,.13)}.w{color:#8a5a00;background:rgba(230,160,20,.16)}
</style></head><body>
<div><div class="k"><img src="../favicon.svg" alt="">AI Visibility Checker</div>
<h1>Can AI find, read and cite your page?</h1>
<p>Crawler rules, llms.txt, sitemap, structured data, link previews, and text that's there without JavaScript.</p></div>
<div class="card">
<div class="row"><span class="c p">Pass</span>AI and search crawlers</div>
<div class="row"><span class="c p">Pass</span>Readable without JavaScript</div>
<div class="row"><span class="c p">Pass</span>Structured data</div>
<div class="row"><span class="c p">Pass</span>Link preview</div>
<div class="row"><span class="c w">Improve</span>llms.txt</div>
</div></body></html>
